name: Refresh Swiss Economic Data
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'
permissions:
  contents: write
concurrency:
  group: swiss-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Refresh official APIs and validate observations
        run: python data_pipeline.py
      - name: Commit successfully refreshed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official Swiss economic indicators"
            git push
          fi
